<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio test bench</title>
  <style>
    :root { --bg: #17131a; --panel: #231d27; --ink: #f3ece4; --mute: #a99fae; --acc: #e8b04a; --acc2: #c0485e; --line: #3a3140; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    h1 { font-size: 20px; margin: 4px 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 0 0 8px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #30283a; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--acc); }
    button.on { background: var(--acc); color: #1b1410; border-color: var(--acc); }
    button.big { background: var(--acc2); border-color: var(--acc2); font-weight: 600; padding: 10px 16px; }
    label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-right: 14px; color: var(--mute); max-width: 100%; }
    input[type=range] { width: 180px; max-width: 100%; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--mute); white-space: pre-wrap; }
    .beatbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .dot { width: 46px; height: 46px; border-radius: 50%; background: #3a3140; transition: background .08s, transform .08s; }
    .dot.flash { background: var(--acc); transform: scale(1.12); }
    .dot.down { background: var(--acc2); transform: scale(1.2); }
    .bar4 { display: flex; gap: 6px; }
    .bar4 span { width: 16px; height: 16px; border-radius: 3px; background: #3a3140; }
    .bar4 span.cur { background: var(--acc); }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #ff9c9c; white-space: pre-wrap; max-height: 120px; overflow: auto; }
    @media (max-width: 600px) { input[type=range] { width: 120px; } main { padding: 16px; } }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Audio test bench</h1>
    <section>
      <div class="row">
        <button class="big" id="unlock">Unlock audio</button>
        <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" /></label>
        <label><input id="mute" type="checkbox" /> Muted</label>
      </div>
      <div id="status" style="margin-top:8px"></div>
    </section>

    <section>
      <h2>Music</h2>
      <div class="grid" id="tracks"></div>
      <div class="row" style="margin-top:10px">
        <button id="stop">Stop music</button>
        <label>Fade (s) <input id="fade" type="number" min="0" max="5" step="0.1" value="1.5" style="width:60px" /></label>
        <label>Intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5" /> <span id="intv">0.50</span></label>
      </div>
    </section>

    <section>
      <h2>Beat sync</h2>
      <div class="beatbox">
        <div class="dot" id="dot"></div>
        <div class="bar4" id="bar4"><span></span><span></span><span></span><span></span></div>
        <button id="tap">Tap on the beat (or press Space)</button>
        <span id="tapres" style="color:var(--mute)"></span>
      </div>
    </section>

    <section>
      <h2>Sound effects</h2>
      <div class="grid" id="sfx"></div>
      <div class="row" style="margin-top:10px">
        <button id="ringloop">phoneRing loop: off</button>
        <label>Pitch <input id="pitch" type="range" min="0.5" max="2" step="0.01" value="1" /> <span id="pv">1.00</span></label>
      </div>
    </section>

    <section>
      <h2>Car</h2>
      <div class="row">
        <button id="engine">Engine: off</button>
        <button id="horn">Horn</button>
        <label>Speed <input id="speed" type="range" min="0" max="1" step="0.01" value="0" /> <span id="sv">0.00</span></label>
        <label>Throttle <input id="thr" type="range" min="0" max="1" step="0.01" value="0" /> <span id="tv">0.00</span></label>
        <label><input id="auto" type="checkbox" /> Auto drive (accelerate / coast loop)</label>
      </div>
    </section>

    <section>
      <h2>Ambience</h2>
      <div class="grid" id="amb"></div>
    </section>

    <section>
      <h2>Console</h2>
      <div id="log">(no errors)</div>
    </section>
  </main>
  <script type="module" src="./audio.js"></script>
</body>
</html>
