<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Lineup</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2230; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
    #ui { position: fixed; top: 8px; left: 8px; background: rgba(15, 18, 28, 0.82); padding: 10px 12px; border-radius: 8px; max-width: 300px; z-index: 2; }
    #ui label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    #ui select, #ui input[type=range] { flex: 1; }
    #ui .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #ui button { background: #34405a; color: #eee; border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
    #stats { margin-top: 6px; font-size: 11px; color: #aab; white-space: pre; max-height: 240px; overflow: auto; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Characters</b>
    <label>Anim <select id="anim"></select></label>
    <label>Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1" /></label>
    <label>Haldi <input id="haldi" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label><input id="sehra" type="checkbox" checked /> Sehra (sherwani groom)</label>
    <label><input id="garland" type="checkbox" /> Garland (groom + bride)</label>
    <label><input id="look" type="checkbox" /> Look at camera</label>
    <label>Horse <select id="horseAnim"><option>idle</option><option>walk</option><option>trot</option></select></label>
    <label>Focus <select id="focus"><option value="">overview</option></select></label>
    <div class="row"><button id="close">Close-up</button><button id="full">Full body</button></div>
    <div id="stats"></div>
  </div>
  <script type="module" src="./characters.js"></script>
</body>
</html>
